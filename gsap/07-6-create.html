<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>07-6. ScrollTrigger.create()</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#1a1a2e;color:#fff}
.sec1{height:100vh;display:flex;align-items:center;justify-content:center}
.box{width:150px;height:150px;background:#e94560;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:bold}
.spacer{height:100vh;display:flex;align-items:center;justify-content:center;font-size:24px;background:#16213e}
</style>
</head>
<body>
<div class="spacer">ScrollTrigger.create() ↓</div>
<div class="sec1"><div class="box">timeline</div></div>
<div class="spacer">끝</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

const ani = gsap.timeline();
ani
  .to(".box", { rotation: 450, scale: 0, borderRadius: 200 })
  .to(".box", { rotation: 360 * 5, scale: 1, borderRadius: 20 });

ScrollTrigger.create({
  animation: ani,
  trigger: ".sec1",
  start: "top top",
  end: "+=2000",
  scrub: true,
  pin: true,
  anticipatePin: 1,
  markers: true,
});
</script>
</body>
</html>
