<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>09. TextPlugin 타이핑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:30px;font-family:sans-serif;background:#1a1a2e;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh}
.msg{font-size:36px;color:#f0c368;border-right:2px solid #f0c368;padding-right:5px}
</style>
</head>
<body>
<h2 class="msg"></h2>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/TextPlugin.min.js"></script>
<script>
gsap.registerPlugin(TextPlugin);

gsap.to(".msg", {
  text: "안녕하세요, GSAP 세계에 오신 것을 환영합니다!",
  duration: 3,
  ease: "none",
});
</script>
</body>
</html>
