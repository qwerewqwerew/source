<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>05-3. Timeline defaults</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:30px;font-family:sans-serif;background:#1a1a2e;color:#fff}
h1{margin-bottom:20px;font-size:22px}
h2{font-size:28px;margin-bottom:10px;color:#0ae448}
p{font-size:16px;margin-bottom:10px;color:#ccc}
a.btn{display:inline-block;padding:10px 20px;background:blueviolet;color:#fff;text-decoration:none;border-radius:10px;margin-bottom:20px}
img{max-width:200px;border-radius:8px}
</style>
</head>
<body>
<h1>05-3. Timeline defaults — 시차 등장</h1>
<h2>JavaScript GSAP Animation</h2>
<p>Lorem ipsum dolor sit amet, consectetur adipisicing elit.</p>
<a class="btn" href="#">Button</a>
<br>
<img src="https://picsum.photos/200/150?random=1" alt="sample">

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
let tl = gsap.timeline({ defaults: { duration: 1 } });

tl.from("h2", { y: -50, opacity: 0 })
  .from("p", { y: -50, opacity: 0 }, "-=0.5")
  .from("a", { y: -50, opacity: 0 }, "+=1")
  .from("img", { y: 200, opacity: 0 }, "3");
</script>
</body>
</html>
