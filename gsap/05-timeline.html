<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>05. Timeline</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:30px;font-family:sans-serif;background:#1a1a2e;color:#fff;overflow:hidden}
h1{margin-bottom:30px;font-size:22px}
div[class^="box"]{width:100px;height:100px;margin:4px 0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;border-radius:8px}
.one{background:red}
.two{background:green}
.three{background:blue}
.four{background:pink;color:#222}
</style>
</head>
<body>
<h1>05. Timeline — 순서 실행 + Position Parameter</h1>
<div class="one">one</div>
<div class="two">two</div>
<div class="three">three</div>
<div class="four">four</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
let tl = gsap.timeline();

tl.to(".one", { duration: 2, x: 500 })
  .to(".two", { duration: 3, x: 500 }, 1)
  .to(".three", { duration: 1, x: 500 }, "<")
  .to(".four", { duration: 1, x: 500 }, "<0.5");
</script>
</body>
</html>
