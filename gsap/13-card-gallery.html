<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>13. 실전 종합 — 카드 갤러리</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#1a1a2e;color:#fff}
.hero{height:100vh;display:flex;align-items:center;justify-content:center;font-size:36px}
.gallery{display:flex;gap:30px;padding:60px 30px;justify-content:center;min-height:80vh;align-items:flex-start}
.card{width:250px;height:350px;background:#16213e;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;border:2px solid #0f3460}
.spacer{height:60vh}
</style>
</head>
<body>
<section class="hero">
  <h1>스크롤을 내려보세요 ↓</h1>
</section>
<section class="gallery">
  <div class="card">카드 1</div>
  <div class="card">카드 2</div>
  <div class="card">카드 3</div>
</section>
<div class="spacer"></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

gsap.from(".card", {
  y: 80,
  opacity: 0,
  duration: 0.8,
  stagger: 0.3,
  ease: "power2.out",
  scrollTrigger: {
    trigger: ".gallery",
    start: "top 70%",
  },
});
</script>
</body>
</html>
