<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>05-4. 애니메이션 핸들링</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:30px;font-family:sans-serif;background:#1a1a2e;color:#fff}
h1{margin-bottom:30px;font-size:22px}
.box1{width:100px;height:100px;background:red;border-radius:8px;margin-bottom:20px}
.nav{display:flex;gap:10px}
.nav button{padding:10px 18px;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;background:#0ae448;color:#222}
.nav button:hover{background:#08c73d}
</style>
</head>
<body>
<h1>05-4. 애니메이션 핸들링</h1>
<div class="box1"></div>
<div class="nav">
  <button id="play">시작</button>
  <button id="pause">정지</button>
  <button id="resume">재개</button>
  <button id="reverse">반전</button>
  <button id="restart">재시작</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
const tween = gsap.to(".box1", { duration: 8, x: 400, width: 400, paused: true });

document.querySelector("#play").onclick = () => tween.play();
document.querySelector("#pause").onclick = () => tween.pause();
document.querySelector("#resume").onclick = () => tween.resume();
document.querySelector("#reverse").onclick = () => tween.reverse();
document.querySelector("#restart").onclick = () => tween.restart();
</script>
</body>
</html>
