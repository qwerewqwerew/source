<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>08. SplitText</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:30px;font-family:sans-serif;background:#1a1a2e;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh}
.title{font-size:40px;color:#0ae448}
</style>
</head>
<body>
<h2 class="title">안녕하세요, GSAP 세계에 오신 것을 환영합니다!</h2>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/SplitText.min.js"></script>
<script>
gsap.registerPlugin(SplitText);

const split = SplitText.create(".title", {
  type: "chars, words",
});

gsap.from(split.chars, {
  y: 50,
  opacity: 0,
  stagger: 0.05,
  duration: 0.6,
  ease: "back.out",
});
</script>
</body>
</html>
