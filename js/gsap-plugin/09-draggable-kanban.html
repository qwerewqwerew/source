<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draggable — 드래그 앤 드롭 카드</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a1a2e; }
  .board { width: 500px; height: 500px; background: #16213e; border-radius: 12px; position: relative; border: 2px dashed #333; }
  .card { width: 100px; height: 100px; border-radius: 8px; display: flex; justify-content: center; align-items: center; color: #fff; font-weight: 700; font-size: 0.85rem; position: absolute; cursor: grab; user-select: none; }
  .card:active { cursor: grabbing; }
  .card:nth-child(1) { background: #7f77dd; top: 20px; left: 20px; }
  .card:nth-child(2) { background: #e94560; top: 20px; left: 140px; }
  .card:nth-child(3) { background: #00b894; top: 20px; left: 260px; }
  .card:nth-child(4) { background: #fdcb6e; color: #333; top: 140px; left: 20px; }
  .info { position: fixed; bottom: 1.5rem; color: #555; font-size: 0.85rem; }
</style>
</head>
<body>
  <div class="board">
    <div class="card">카드 1</div>
    <div class="card">카드 2</div>
    <div class="card">카드 3</div>
    <div class="card">카드 4</div>
  </div>
  <p class="info">카드를 드래그해 보세요 — 120px 격자에 흡착</p>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14/dist/Draggable.min.js"></script>
  <script>
    gsap.registerPlugin(Draggable);

    Draggable.create(".card", {
      type: "x,y",
      bounds: ".board",
      edgeResistance: 0.65,
      snap: {
        x: v => Math.round(v / 120) * 120,
        y: v => Math.round(v / 120) * 120
      },
      onDragEnd() {
        console.log("x:", this.x, "y:", this.y);
      }
    });
  </script>
</body>
</html>
