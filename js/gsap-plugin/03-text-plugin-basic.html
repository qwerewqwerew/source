<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text — innerHTML 순차 타이핑</title>
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1e1e1e; font-family: 'Courier New', monospace; }
  .terminal { color: #00ff41; font-size: 1.5rem; background: #0d0d0d; padding: 2rem; border-radius: 8px; border: 1px solid #333; min-width: 400px; min-height: 1.5em; cursor: pointer; }
  .terminal::before { content: "> "; color: #888; }
  .new-char { color: #fff; }
  .info { position: fixed; bottom: 1.5rem; color: #555; font-size: 0.85rem; }
</style>
</head>
<body>
  <div class="terminal"></div>
  <p class="info">클릭하면 다시 재생</p>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14/dist/TextPlugin.min.js"></script>
  <script>
    gsap.registerPlugin(TextPlugin);

    function play() {
      document.querySelector(".terminal").textContent = "";
      gsap.to(".terminal", {
        duration: 3,
        text: {
          value: "Hello, world! 타이핑 완료.",
          delimiter: "",
          newClass: "new-char"
        },
        ease: "none"
      });
    }

    play();
    document.querySelector(".terminal").addEventListener("click", play);
  </script>
</body>
</html>
