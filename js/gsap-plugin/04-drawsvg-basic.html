<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrawSVG — 선 그리기 애니메이션</title>
<style>
  body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a1a2e; }
  svg { width: 400px; height: 400px; cursor: pointer; }
  .info { position: fixed; bottom: 1.5rem; color: #555; font-size: 0.85rem; }
</style>
</head>
<body>
  <svg viewBox="0 0 200 200">
    <path class="path" d="M 20,100 Q 50,20 100,100 T 180,100" fill="none" stroke="#7f77dd" stroke-width="3" stroke-linecap="round"/>
    <circle class="path2" cx="100" cy="100" r="60" fill="none" stroke="#00ff41" stroke-width="2"/>
  </svg>
  <p class="info">클릭하면 다시 재생</p>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14/dist/DrawSVGPlugin.min.js"></script>
  <script>
    gsap.registerPlugin(DrawSVGPlugin);

    function play() {
      gsap.set(".path, .path2", { drawSVG: "0%" });
      const tl = gsap.timeline();
      tl.to(".path", {
        drawSVG: "100%",
        duration: 2,
        ease: "power2.inOut"
      })
      .to(".path2", {
        drawSVG: "100%",
        duration: 1.5,
        ease: "power2.inOut"
      }, "-=1");
    }

    play();
    document.querySelector("svg").addEventListener("click", play);
  </script>
</body>
</html>
