<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inertia — 드래그 관성 슬라이더</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a1a2e; overflow: hidden; }
  .viewport { width: 320px; overflow: hidden; border-radius: 12px; }
  .track { display: flex; gap: 20px; cursor: grab; }
  .track:active { cursor: grabbing; }
  .slide { min-width: 280px; height: 200px; border-radius: 12px; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 1.5rem; font-weight: 700; flex-shrink: 0; }
  .slide:nth-child(1) { background: #7f77dd; }
  .slide:nth-child(2) { background: #e94560; }
  .slide:nth-child(3) { background: #00b894; }
  .slide:nth-child(4) { background: #fdcb6e; color: #333; }
  .info { position: fixed; bottom: 1.5rem; color: #555; font-size: 0.85rem; }
</style>
</head>
<body>
  <div class="viewport">
    <div class="track">
      <div class="slide">슬라이드 1</div>
      <div class="slide">슬라이드 2</div>
      <div class="slide">슬라이드 3</div>
      <div class="slide">슬라이드 4</div>
    </div>
  </div>
  <p class="info">좌우로 드래그 후 손을 떼면 관성으로 미끄러짐</p>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14/dist/Draggable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14/dist/InertiaPlugin.min.js"></script>
  <script>
    gsap.registerPlugin(Draggable, InertiaPlugin);

    Draggable.create(".track", {
      type: "x",
      inertia: true,
      bounds: { minX: -900, maxX: 0 },
      snap: x => Math.round(x / 300) * 300
    });
  </script>
</body>
</html>
