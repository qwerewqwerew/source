<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flip — 레이아웃 전환 애니메이션</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; background: #1a1a2e; padding: 2rem; }
  .toggle-btn { padding: 0.7rem 2rem; background: #7f77dd; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 600; margin-bottom: 2rem; }
  .container { display: grid; grid-template-columns: repeat(4, 100px); gap: 12px; }
  .container.list-view { grid-template-columns: 1fr; }
  .item { height: 100px; border-radius: 8px; display: flex; justify-content: center; align-items: center; color: #fff; font-weight: 700; font-size: 0.9rem; }
  .container.list-view .item { height: 50px; }
  .item:nth-child(1) { background: #e94560; }
  .item:nth-child(2) { background: #00b894; }
  .item:nth-child(3) { background: #fdcb6e; color: #333; }
  .item:nth-child(4) { background: #7f77dd; }
  .item:nth-child(5) { background: #ff9f43; }
  .item:nth-child(6) { background: #a29bfe; }
  .item:nth-child(7) { background: #00cec9; }
  .item:nth-child(8) { background: #fd79a8; }
</style>
</head>
<body>
  <button class="toggle-btn">그리드 ↔ 리스트 전환</button>
  <div class="container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
    <div class="item">7</div>
    <div class="item">8</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14/dist/Flip.min.js"></script>
  <script>
    gsap.registerPlugin(Flip);

    const container = document.querySelector(".container");
    const items = document.querySelectorAll(".item");

    document.querySelector(".toggle-btn").addEventListener("click", () => {
      const state = Flip.getState(items);
      container.classList.toggle("list-view");
      Flip.from(state, {
        duration: 0.6,
        ease: "power2.inOut",
        stagger: 0.04,
        absolute: true
      });
    });
  </script>
</body>
</html>
