<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Observer — 스크롤 방향 감지 UI</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }
  .section { position: absolute; top: 0; left: 0; width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center; font-size: 2.5rem; font-weight: 700; color: #fff; }
  .section:nth-child(1) { background: #1a1a2e; z-index: 4; }
  .section:nth-child(2) { background: #16213e; z-index: 3; }
  .section:nth-child(3) { background: #0f3460; z-index: 2; }
  .section:nth-child(4) { background: #533483; z-index: 1; }
  .info { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.4); font-size: 0.85rem; z-index: 10; }
</style>
</head>
<body>
  <div class="section">섹션 1 — 휠 또는 터치로 이동</div>
  <div class="section">섹션 2</div>
  <div class="section">섹션 3</div>
  <div class="section">섹션 4</div>
  <p class="info">마우스 휠 또는 터치 스와이프</p>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14/dist/Observer.min.js"></script>
  <script>
    gsap.registerPlugin(Observer);

    const sections = gsap.utils.toArray(".section");
    let current = 0;
    let animating = false;

    sections.forEach((s, i) => {
      if (i > 0) gsap.set(s, { yPercent: 100 });
    });

    Observer.create({
      type: "wheel,touch",
      tolerance: 10,
      onDown: () => {
        if (animating || current >= sections.length - 1) return;
        animating = true;
        current++;
        gsap.to(sections[current], {
          yPercent: 0,
          duration: 0.9,
          ease: "power2.inOut",
          onComplete: () => animating = false
        });
      },
      onUp: () => {
        if (animating || current <= 0) return;
        animating = true;
        gsap.to(sections[current], {
          yPercent: 100,
          duration: 0.9,
          ease: "power2.inOut",
          onComplete: () => { animating = false; current--; }
        });
      }
    });
  </script>
</body>
</html>
